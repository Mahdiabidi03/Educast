services:
  frontend:
    build: ./educast-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build: ./educast-backend
    ports:
      - "3000:3000"
    env_file:
      - ./educast-backend/.env.docker
    depends_on:
      - postgres
      - mongodb
      - ai-service
    volumes:
      - uploads_data:/app/uploads

  ai-service:
    build: ./educast-ai-service
    ports:
      - "8000:8000"
    env_file:
      - ./educast-ai-service/.env.docker
    depends_on:
      - mlflow
    volumes:
      - uploads_data:/app/uploads

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: educast
      POSTGRES_PASSWORD: educast_password
      POSTGRES_DB: educast
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mlflow:
    image: python:3.12-slim
    working_dir: /mlflow
    command: >
      sh -c "pip install mlflow &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlflow/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow

volumes:
  postgres_data:
  mongo_data:
  uploads_data:
  mlflow_data: